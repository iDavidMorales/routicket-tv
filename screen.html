<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05080d">
  <title>Routicket TV · Screen</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:stretch}.stage{position:relative;width:100%;height:100%;background:#05080d}.media{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}.media.cover{object-fit:cover}.welcome{position:absolute;inset:0;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 35%,#17304d 0,#09111c 42%,#05080d 78%);text-align:center}.welcome-card{max-width:720px}.logo{width:74px;height:74px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#1683ff,#0f6ed8);font-size:2rem;box-shadow:0 18px 60px rgba(22,131,255,.28)}h1{font-size:clamp(2rem,6vw,4.5rem);margin:0 0 12px}.welcome p{color:#aab8c6;font-size:clamp(1rem,2vw,1.35rem);line-height:1.5}.code{display:inline-block;margin-top:16px;padding:12px 18px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.06);font-weight:900;letter-spacing:.14em}.qr-view{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:#101828;padding:30px}.qr-card{text-align:center;max-width:min(88vw,760px)}.qr-card h1{font-size:clamp(1.8rem,5vw,4rem)}.qr-card p{color:#64748b;font-size:clamp(.95rem,2vw,1.25rem);word-break:break-word}.qr-box{width:min(54vh,70vw);height:min(54vh,70vw);margin:24px auto;padding:20px;border-radius:28px;background:#fff;box-shadow:0 20px 80px rgba(15,23,42,.14);display:grid;place-items:center}.qr-box canvas,.qr-box img{max-width:100%;max-height:100%}.hud{position:fixed;left:18px;right:18px;bottom:18px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(8,13,20,.68);backdrop-filter:blur(16px);opacity:.12;transition:.2s}.hud:hover,.hud:focus-within{opacity:1}.hud strong,.hud small{display:block}.hud small{color:#9fb0c1;margin-top:2px}.hud-actions{display:flex;gap:8px}.hud button{width:42px;height:42px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer}.error-box{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;background:#0a1018}.error-box div{max-width:620px}.error-box a{display:inline-flex;margin-top:14px;padding:12px 16px;border-radius:12px;background:#1683ff;color:white;text-decoration:none;font-weight:800}@media(max-width:700px){.hud{left:8px;right:8px;bottom:8px}.hud small{display:none}}
  </style>
</head>
<body>
  <main class="stage" id="stage"></main>
  <div class="hud">
    <div><strong id="hudName">Routicket TV</strong><small id="hudStatus">Esperando contenido</small></div>
    <div class="hud-actions"><button id="reloadBtn" title="Recargar"><span>↻</span></button><button id="fullBtn" title="Pantalla completa"><span>⛶</span></button></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="./screen.js"></script>
</body>
</html>
